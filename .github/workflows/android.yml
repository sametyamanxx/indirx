name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Check only YouTube and Instagram extractors are enabled
        run: python3 scripts/check_extractors.py
      - name: Verify and prepare installable APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IndirX-0.2.7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IndirX-0.2.7-APK
          path: dist/IndirX-0.2.7.apk
          if-no-files-found: error
