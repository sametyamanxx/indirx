name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore persistent Android signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE" && test -n "$SIGNING_PASSWORD"
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/indirx-signing.p12"
          echo "INDIRX_SIGNING_STORE=$RUNNER_TEMP/indirx-signing.p12" >> "$GITHUB_ENV"
          echo "INDIRX_SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Save Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-diagnostics
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Check only YouTube and Instagram extractors are enabled
        run: python3 scripts/check_extractors.py
      - name: Verify and prepare installable APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IndirX-0.2.12.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IndirX-0.2.12-APK
          path: dist/IndirX-0.2.12.apk
          if-no-files-found: error
